
name: Hey Luka Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          unzip -o -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure AndroidX and Gradle memory
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"

          set_property() {
            KEY="$1"
            VALUE="$2"

            if grep -q "^${KEY}=" "$FILE"; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$FILE"
            else
              echo "${KEY}=${VALUE}" >> "$FILE"
            fi
          }

          set_property "android.useAndroidX" "true"
          set_property "android.enableJetifier" "true"
          set_property "org.gradle.jvmargs" "-Xms256m -Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          set_property "org.gradle.workers.max" "2"
          set_property "org.gradle.parallel" "false"

          echo "Gradle configuration:"
          cat "$FILE"


      - name: Create missing Android XML resource
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/xml"
          cat > "$PROJECT_DIR/app/src/main/res/xml/data_extraction_rules.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="no_backup"/>
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="no_backup"/>
              </device-transfer>
          </data-extraction-rules>
          EOF
          

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            --max-workers=2 \
            assembleDebug \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyLuka-Debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14
          
