
name: Hey Luka Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository root-e kono ZIP file nei."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts paoa jayni."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: App module-er build.gradle file paoa jayni."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Enable AndroidX
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_DIR/gradle.properties"
          touch "$FILE"

          grep -qxF 'android.useAndroidX=true' "$FILE" || \
            echo 'android.useAndroidX=true' >> "$FILE"

          grep -qxF 'android.enableJetifier=true' "$FILE" || \
            echo 'android.enableJetifier=true' >> "$FILE"

          echo "AndroidX configuration:"
          cat "$FILE"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK file তৈরি হয়নি."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeyLuka-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
